
name: Generate Gradle Wrapper

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gradle-wrapper-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Josh-Fynly/autocrop-android'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the development branch
        uses: actions/checkout@v7
        with:
          ref: feature/repository-foundation
          persist-credentials: true

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Generate the Gradle Wrapper
        run: |
          set -euo pipefail

          if [ -e gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle Wrapper already exists. Stopping."
            exit 1
          fi

          gradle wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin

          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Commit Wrapper files to development branch
        run: |
          set -euo pipefail

          chmod +x gradlew

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gradlew
          git add gradlew.bat
          git add gradle/wrapper/gradle-wrapper.jar
          git add gradle/wrapper/gradle-wrapper.properties

          git commit -m "build: add Gradle 9.6.0 wrapper"

          git push origin HEAD:feature/repository-foundation
          
